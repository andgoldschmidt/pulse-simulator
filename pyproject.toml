[tool.poetry]
name = "pulse-simulator"
version = "0.1.1"
description = ""
authors = ["Andy Goldschmidt <agoldschmidt11@gmail.com>, Emilio Pelaez <epelaez@uchicago.edu>"]
readme = "README.md"


[tool.poetry.dependencies]
python = "^3.10,<3.13"
numpy = "^1.26.2"
scipy = "^1.11.3"
qiskit = "^0.45.0"
matplotlib = "^3.8.1"
importlib = "^1.0.4"
qiskit-dynamics = "^0.4.2"
ipykernel = "^6.26.0"
pylatexenc = "^2.10"
jax = "^0.4.28"
jaxlib = "^0.4.28"
sympy = "^1.12"
qiskit-aer = "^0.13.2"
tqdm = "^4.66.1"

# GPU jax (for your system)
# jax = {extras = ["cuda11_pip"], version = "^0.4.20"}
# jaxlib = {version = "0.4.23+cuda11.cudnn89", source = "jax"}

# [[tool.poetry.source]]
# name = "jax"
# url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
# priority = "primary"

# dev
pytest = {version="^7.4.4", optional = true}
flake8-pyproject = {version="^1.2.3", optional = true}

[tool.poetry.extras]
dev = ["pytest"]


[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.flake8]
max-line-length = 90

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
